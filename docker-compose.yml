networks:
  internal:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: agenticpacks_oss_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agenticpacks_oss
    # Reachable only on the Compose network — not published to the host.
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenticpacks_oss"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: alpine:3.20
    container_name: agenticpacks_oss_db_backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgrespassword
      PGDATABASE: agenticpacks_oss
      BACKUP_RETENTION_DAYS: "7"
      TZ: UTC
    volumes:
      - postgres_backup_data:/backups
      - ./docker/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
      - ./docker/postgres-backup-entrypoint.sh:/usr/local/bin/postgres-backup-entrypoint.sh:ro
    networks:
      - internal
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-backup-entrypoint.sh"]

  app:
    image: agenticpacks-oss-app-prod:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: agenticpacks_oss_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/agenticpacks_oss
      - NEXTAUTH_URL=http://localhost:${PORT:-3000}
      - NEXT_PUBLIC_APP_URL=http://localhost:${PORT:-3000}
      - AUTH_SECRET=agenticpacks-oss-prod-secret-key-32-chars-long
      - AUTH_TRUST_HOST=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_APP_ID=${STRIPE_APP_ID:-agenticpacks-oss}
      - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-4096}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
  postgres_backup_data:
