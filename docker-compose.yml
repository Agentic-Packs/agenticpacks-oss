services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_starter_community_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_starter_community
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_starter_community"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ai-starter-community-app-prod:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ai_starter_community_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/ai_starter_community
      - NEXTAUTH_URL=http://localhost:${PORT:-3000}
      - NEXT_PUBLIC_APP_URL=http://localhost:${PORT:-3000}
      - AUTH_SECRET=community-prod-secret-key-32-chars-long
      - AUTH_TRUST_HOST=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_APP_ID=${STRIPE_APP_ID:-agenticpacks-oss}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
